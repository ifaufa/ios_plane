name: build-ipa

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Generate project
        run: xcodegen

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project PlaneM3U8.xcodeproj \
            -scheme PlaneM3U8 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Ad-hoc sign app
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "Signing: $APP_PATH"
          codesign --force --sign - --timestamp=none "$APP_PATH" || echo "ad-hoc sign failed (continuing)"
          codesign -dv "$APP_PATH" 2>&1 || true

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "Found app: $APP_PATH"
          rm -rf Payload PlaneM3U8.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          chmod +x "Payload/$(basename "$APP_PATH")/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")" || true
          ditto -c -k --sequesterRsrc --keepParent Payload PlaneM3U8.ipa
          echo "--- IPA 内容 ---"
          unzip -l PlaneM3U8.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlaneM3U8-ipa
          path: PlaneM3U8.ipa
